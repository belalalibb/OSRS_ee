[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-ee"
version = "0.1.0"
description = "OSRS_ee local core: contracts, SQLite store, single-owner worker, fake-first control plane, advisory layer, release policy. Offline; no game client included."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - owner repository" }
dependencies = [
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
osrs-ee = "osrs_ee.cli:main"

[tool.setuptools]
packages = ["osrs_ee"]

[tool.setuptools.package-data]
osrs_ee = ["store_schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
